    container_name: weather_usgs_water_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      USGS_WATER_ENABLED: "${USGS_WATER_ENABLED:-false}"
      USGS_WATER_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_usgs_water_ingestion.py --interval 15

  youtube-ingestion:
    image: docker-backend
    container_name: weather_youtube_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      YOUTUBE_ENABLED: "${YOUTUBE_ENABLED:-false}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      YOUTUBE_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_youtube_ingestion.py --interval 15

  reddit-ingestion:
    image: docker-backend
    container_name: weather_reddit_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      REDDIT_ENABLED: "${REDDIT_ENABLED:-false}"
      REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID:-}"
      REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET:-}"
      REDDIT_USER_AGENT: "${REDDIT_USER_AGENT:-}"
      REDDIT_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
