    command: python scripts/run_reddit_ingestion.py --interval 15

  mastodon-ingestion:
    image: docker-backend
    container_name: weather_mastodon_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      MASTODON_ENABLED: "${MASTODON_ENABLED:-false}"
      MASTODON_INSTANCE: "${MASTODON_INSTANCE:-}"
      MASTODON_ACCESS_TOKEN: "${MASTODON_ACCESS_TOKEN:-}"
      MASTODON_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_mastodon_ingestion.py --interval 15

  bluesky-ingestion:
    image: docker-backend
    container_name: weather_bluesky_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      BLUESKY_ENABLED: "${BLUESKY_ENABLED:-false}"
      BLUESKY_IDENTIFIER: "${BLUESKY_IDENTIFIER:-}"
      BLUESKY_APP_PASSWORD: "${BLUESKY_APP_PASSWORD:-}"
      BLUESKY_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_bluesky_ingestion.py --interval 15

  weatherapi-ingestion:
    image: docker-backend
    container_name: weather_weatherapi_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      WEATHERAPI_ENABLED: "${WEATHERAPI_ENABLED:-false}"
      WEATHERAPI_API_KEY: "${WEATHERAPI_API_KEY:-}"
      WEATHERAPI_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_weatherapi_ingestion.py --interval 15

volumes:
  postgres_data:
  uploads_data:
  kafka_data:
