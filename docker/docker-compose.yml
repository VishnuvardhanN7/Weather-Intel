    container_name: weather_openaq_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      OPENAQ_ENABLED: "${OPENAQ_ENABLED:-false}"
      OPENAQ_API_KEY: "${OPENAQ_API_KEY:-}"
      OPENAQ_INTERVAL_SECONDS: "900"
    volumes:
