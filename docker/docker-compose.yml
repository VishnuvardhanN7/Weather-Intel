services:
  postgres:
    image: postgres:16-alpine
    container_name: weather_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: weather_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  init-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: weather_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: >
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.raw --partitions 1 --replication-factor 1 && \
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.clean --partitions 1 --replication-factor 1 && \
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather.verified --partitions 1 --replication-factor 1 && \
      echo 'Kafka topics created successfully.'
      "

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: weather_kafka_connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: 'kafka-connect'
      CONNECT_GROUP_ID: 'compose-connect-group'
      CONNECT_CONFIG_STORAGE_TOPIC: 'connect-configs'
      CONNECT_OFFSET_STORAGE_TOPIC: 'connect-offsets'
      CONNECT_STATUS_STORAGE_TOPIC: 'connect-status'
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: 'org.apache.kafka.connect.storage.StringConverter'
      CONNECT_VALUE_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker-backend
    container_name: weather_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/weather_platform
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/weather_platform
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-this-in-production
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://127.0.0.1:5173","http://127.0.0.1:5174","http://127.0.0.1:5175","http://localhost:3000","http://localhost:8000","http://localhost:80"]'
      DEBUG: "true"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      KAFKA_CLEAN_TOPIC: "weather.clean"
      KAFKA_VERIFIED_TOPIC: "weather.verified"
      SINK_ALERTNESS_THRESHOLD: "0.90"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY}"
      NOAA_ENABLED: "true"
      NOAA_API_KEY: "${NOAA_API_KEY:-}"
      OPENAQ_ENABLED: "true"
      OPENAQ_API_KEY: "${OPENAQ_API_KEY:-}"
      YOUTUBE_ENABLED: "true"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      BLUESKY_ENABLED: "true"
      BLUESKY_IDENTIFIER: "${BLUESKY_IDENTIFIER:-}"
      BLUESKY_APP_PASSWORD: "${BLUESKY_APP_PASSWORD:-}"
      WEATHERAPI_ENABLED: "true"
      WEATHERAPI_API_KEY: "${WEATHERAPI_API_KEY:-}"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  pipeline-worker:
    image: docker-backend
    container_name: weather_pipeline_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/weather_platform
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/weather_platform
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      KAFKA_CLEAN_TOPIC: "weather.clean"
      KAFKA_VERIFIED_TOPIC: "weather.verified"
      SINK_ALERTNESS_THRESHOLD: "0.90"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY}"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: python scripts/run_pipeline_worker.py

  api-ingestion:
    image: docker-backend
    container_name: weather_api_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY}"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_api_ingestion.py --interval 300

  open-meteo-ingestion:
    image: docker-backend
    container_name: weather_open_meteo_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      OPEN_METEO_ENABLED: "true"
      OPEN_METEO_INTERVAL_SECONDS: "900"
      OPEN_METEO_BATCH_SIZE: "50"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_open_meteo_ingestion.py --interval 15

  imd-ingestion:
    image: docker-backend
    container_name: weather_imd_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      IMD_ENABLED: "true"
      IMD_API_BASE_URL: "https://api.imd.gov.in"
      IMD_API_KEY: "${IMD_API_KEY:-}"
      IMD_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_imd_ingestion.py --interval 15

  mosdac-ingestion:
    image: docker-backend
    container_name: weather_mosdac_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      MOSDAC_ENABLED: "${MOSDAC_ENABLED:-false}"
      MOSDAC_USERNAME: "${MOSDAC_USERNAME:-}"
      MOSDAC_PASSWORD: "${MOSDAC_PASSWORD:-}"
      MOSDAC_DATASET_ID: "${MOSDAC_DATASET_ID:-3D_L1B_STD}"
      MOSDAC_INTERVAL_SECONDS: "900"
      MOSDAC_BOUNDING_BOX: "70.0,8.0,90.0,28.0"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_mosdac_ingestion.py --interval 15

  rainviewer-ingestion:
    image: docker-backend
    container_name: weather_rainviewer_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      RAINVIEWER_ENABLED: "${RAINVIEWER_ENABLED:-false}"
      RAINVIEWER_CACHE_SECONDS: "300"
      RAINVIEWER_INTERVAL_SECONDS: "900"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_rainviewer_ingestion.py --interval 15

  nasa-power-ingestion:
    image: docker-backend
    container_name: weather_nasa_power_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      NASA_POWER_ENABLED: "${NASA_POWER_ENABLED:-false}"
      NASA_POWER_INTERVAL_SECONDS: "3600"
      NASA_POWER_CACHE_SECONDS: "1800"
    volumes:
      - ../backend:/app
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    command: python scripts/run_nasa_power_ingestion.py --interval 60

  noaa-ingestion:
    image: docker-backend
    container_name: weather_noaa_ingestion
    environment:
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_RAW_TOPIC: "weather.raw"
      NOAA_ENABLED: "${NOAA_ENABLED:-false}"
      NOAA_API_KEY: "${NOAA_API_KEY:-}"
      NOAA_INTERVAL_SECONDS: "900"
    volumes:
